automation:
  methods:
    - method: "agent"
      models:
        - "leanstral"
        - "claude-opus"
        - "claude-sonnet"
        - "gpt-6-astra"
      framework: >-
        A Claude Code session coordinated Leanstral agents (the primary Lean
        writers), Claude Sonnet and Claude Opus agents (the harder proofs and
        the proof designs of the Kahane, Serrin, Gustafson-Kang-Tsai and
        comparison results) and independent reviewers (Claude Opus and GPT-6
        Astra in Codex), under the authors' supervision.
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0-rc2, with the CKN formalization as a Lake
        dependency. The theorem statements were approved by the authors before
        proof development and fixed by content hash during it. Every result
        was accepted only after an independent review against the paper.
        Verification uses guarded builds with warnings as errors, source-rule
        and axiom checks, and Mathlib-only comparator statements with an
        independent NanoDa replay; the commands are documented in
        docs/VERIFICATION.md and run by the repository's CI workflows.
      cost:
        wall_time: "about 46 hours of development until the last of the thirteen results was proved, plus release preparation"
        spend_usd: "not separately tracked (subscriptions)"
        hardware: "one 16-CPU / 124 GB RAM Linux machine"
      prompting_notes: >-
        The authors determined the mathematical statements. Agents received
        the exact Lean statement to prove together with the paper passage;
        separate reviews compared each formal statement with the paper and
        checked each proof for hypotheses that do not occur in the paper.

  spend_usd: "not separately tracked (subscriptions)"
  notes: >-
    All Lean code was written by the listed models under the supervision of
    the authors, who decided the mathematics and the statements. Every proof
    is checked by the Lean kernel; the library contains no sorry and no custom
    axiom. The Mathlib-only comparators/Challenge.lean contains exactly five
    intentional theorem-body placeholders; the separate Solution.lean proves
    the same named declarations from the library, and comparator.json selects
    all five.

fidelity:
  divergences: >-
    Recorded in docs/DEVIATIONS.md (D1 to D18) and docs/DESIGN_NOTES.md. No
    main result's statement is changed; the supporting statements are stated in
    the form the proofs consume, which in a few places is less than the printed
    text (docs/DEVIATIONS.md, scope of the supporting statements). The main
    proof departures: Kahane's
    theorem and Serrin's estimates are proved by pointwise heat-kernel and
    Newtonian-potential estimates (D12, D13); the Gustafson-Kang-Tsai
    criterion at the top boundary is proved through CKN's Theorem A and the
    Lin pressure estimate (D10), and the singular set at the blow-up time is
    handled by a uniform interior partial-regularity argument (D1, D7); the
    comparison lemma uses a smooth convex energy and Fubini reference times
    (D11); in Section 4 the limiting drift is extracted through time
    primitives (D14), the finite-axis compactness goes through the azimuthal
    vorticity (D15), and the finite-axis limit equation is obtained with a
    cutoff at the axis (D17); the elliptic bounds of Section 5 are applied to
    the velocity instead of its meridional part (D9). Representation choices:
    the solution class carries the paper's energy class on the whole cylinder
    as a separate hypothesis, the regular-point conclusion is boundedness on
    a backward cylinder at the blow-up time, and cylindrical derivatives are
    read on the meridional plane.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
    - "Vlad Vicol"
  notes: >-
    Lean checks each proof against its formal statement. The authors
    reviewed that the statements are the intended theorems; every statement
    was also compared with the paper by independent read-only review agents,
    and the five comparator declarations are checked mechanically. This is
    not external peer review.

alignment:
  namespace: "CIV"
  statements:
    - source: "Theorem 1.1 (thm:main), regularity under anisotropic Type II bounds and analytic forcing"
      lean: "CIV.mainTheorem"
