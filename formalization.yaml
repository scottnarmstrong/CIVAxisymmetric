# Metadata schema version.
version: "v0.4"

project:
  name: "CIVAxisymmetric"
  description: >-
    A Lean 4 / Mathlib formalization of the main results of Constantin,
    Ignatova and Vicol on the regularity of asymptotically axisymmetric
    solutions of the three-dimensional Navier-Stokes equations with analytic
    forcing (arXiv:2609.20803). A suitable weak solution on the unit parabolic
    cylinder, smooth before the blow-up time, whose force is bounded in C^2 up
    to the blow-up time and real analytic in space, whose angular mean
    satisfies anisotropic Type II bounds, and which is exactly axisymmetric on
    a ball around the axis at every time, is axisymmetric and regular at the
    putative singular point (Theorem 1.1); the axisymmetric theorem
    (Theorem 1.3), the meridional smallness proposition, the consequences for
    the force (Corollary 2.3) and the lemmas of Sections 3 and 5 are
    formalized with it. The interior analyticity theorem of Kahane, the
    interior estimates of Serrin and the regularity criterion of Gustafson,
    Kang and Tsai, in the forms the paper uses, are proved rather than
    assumed. The thirteen results use only the standard axioms and build on
    the Lean formalization of the Caffarelli-Kohn-Nirenberg theorem; five of
    them are restated in a Mathlib-only comparator challenge and proved from
    the library theorems.
  authors:
    - "Scott Armstrong"
    - "Vlad Vicol"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Vlad Vicol"
  affiliations:
    - "Scott Armstrong: CNRS and Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
    - "Vlad Vicol: Department of Mathematics, Courant Institute School of Mathematics, Computing, and Data Science, New York University"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."
    - "Vlad Vicol was partially supported by the Collaborative NSF grant DMS-2307681 and by a Simons Investigator Award."

