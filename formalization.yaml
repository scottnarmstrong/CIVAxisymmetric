      class IsSuitableWeakSolution, its Theorem A and pressure estimates, and
      its Sobolev, mollifier and potential library, through public
      declarations only.

status:
  scope: >-
    Complete for the thirteen library results listed under main_results (its
    five CIVChallenge entries are the comparator restatements of five of them):
    Theorem 1.1
    (thm:main), Theorem 1.3 (thm:aniso:main), Proposition 1.5
    (prop:aniso:small), Theorem 2.1 (thm:analytic:interior, Kahane),
    Corollary 2.3 (cor:interior:nonanalytic), Lemmas 3.1, 3.2, 3.3 (both
    assertions) and 5.1, and the three results the paper cites from the
    literature in the forms its proofs use them (Serrin's interior estimates,
    the Gustafson-Kang-Tsai criterion at the top boundary point, and the
    vanishing one-dimensional Hausdorff measure of the singular set at the
    blow-up time). The solution class is CKN's IsSuitableWeakSolution with a
    force exponent q, together with the paper's energy class on the whole
    cylinder up to the blow-up time; smoothness on compact subsets is
    smoothness on the open cylinder, and cylindrical quantities are read on
    the meridional plane (docs/DESIGN_NOTES.md). Not formalized, and not used
    by any of the thirteen results: the divergence-free correction of the
    force in footnote foot:aniso:pressure (a Dirichlet problem on the ball),
    the smooth expansions of an axisymmetric field near the axis (Whitney's
    even-function representation), Remark 2.4 (rem:interior:approximate) and
    Remark 5.2 (rem:interior:meridional). The remarks rem:exterior:nonanalytic and
    rem:force:symmetry are proved as supporting results. The other remarks are not stated as
    separate results, and Appendix A of the paper is outside the scope.
