      status: "proved"
      note: "Comparator pair comparators/{Challenge,Solution}.lean."
    - source: "Theorem 1.3 (thm:aniso:main), regularity of axisymmetric solutions under anisotropic bounds"
      lean: "CIV.axisymmetricTheorem"
      module: "CIV.Statements.AxisymmetricTheorem"
      status: "proved"
      note: "Comparator pair comparators/{Challenge,Solution}.lean."
    - source: "Proposition 1.5 (prop:aniso:small), smallness of the meridional quantities"
      lean: "CIV.meridionalSmallness"
      module: "CIV.Statements.MeridionalSmallnessProp"
      status: "proved"
      note: "Comparator pair comparators/{Challenge,Solution}.lean."
    - source: "Theorem 2.1 (thm:analytic:interior), interior spatial analyticity (Kahane)"
      lean: "CIV.interiorAnalyticity"
      module: "CIV.Statements.InteriorAnalyticity"
      status: "proved"
      note: "Comparator pair comparators/{Challenge,Solution}.lean."
    - source: "Corollary 2.3 (cor:interior:nonanalytic), the force under an axisymmetric core"
      lean: "CIV.forceUnderCore"
      module: "CIV.Statements.ForceUnderCore"
      status: "proved"
      note: "Comparator pair comparators/{Challenge,Solution}.lean."
    - source: "Lemma 3.1 (lem:aniso:axis), maximum principle for functions vanishing on the axis"
      lean: "CIV.axisMaximumPrinciple"
      module: "CIV.Statements.AxisMaximumPrinciple"
      status: "proved"
